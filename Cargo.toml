[workspace]
resolver = "2"
members = [
    "cmd/scaffold",
    "pkg/manifest",
    "pkg/renderer",
    "pkg/fsutil",
    "pkg/executor",
    "pkg/opencode",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["scaffold contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Templating
handlebars = "5.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# File system
tempfile = "3.10"
walkdir = "2.4"

# Diff generation
similar = "2.4"

# Regex for conditions
regex = "1.10"

# Testing
assert_fs = "1.1"
predicates = "3.1"

# Internal crates
manifest = { path = "pkg/manifest" }
renderer = { path = "pkg/renderer" }
fsutil = { path = "pkg/fsutil" }
executor = { path = "pkg/executor" }
opencode = { path = "pkg/opencode" }
