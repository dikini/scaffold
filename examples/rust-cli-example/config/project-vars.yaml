# Project Variables

# Project Information
project_name: rust-cli-example
description: "A command-line tool for processing text files with various transformations"
author: Scaffold User
license: MIT

# Project Configuration
project_type: other
team_size: 1-2
timeline_months: 2

# OpenCode Skills Configuration
include_skills: true
available_skills:
  # Planning Skills
  - write-prd
  - analyze-prd
  - feature-mapping
  # Task Management Skills
  - task-planner
  - task-tracker
  - dependency-manager
  - epic-manager
  - sprint-planner
  # Technical Skills
  - tech-design-doc
  - project-roadmap
  - api-contract

# Planning Preferences
default_license: MIT
default_timeline: 2 months
default_team_size: 1-2 members

# Skill-specific Settings
prd_format: markdown
analysis_depth: detailed
feature_priority_method: value-vs-effort
tech_design_includes: [architecture, api, security, performance]
roadmap_format: [gantt, timeline, kanban]
api_spec_version: "3.0"

# Task Management Settings
task_management_system: beads
beads_integration: true
initialize_beads: true
sprint_duration_weeks: 2
velocity_calculation: story_points
dependency_tracking: enabled
epic_hierarchy: enabled

# Output Directories
output_dirs:
  prd: "docs/prd"
  analysis: "docs/analysis"
  features: "docs/features"
  technical: "docs/technical"
  roadmap: "docs/roadmap"
  api: "docs/api"

# Generated Files
generated_files:
  - "README.md"
  - "docs/project-plan.md"
  - "config/project-vars.yaml"

# Template Generation
generated_at: ""
template_version: "0.1.0"