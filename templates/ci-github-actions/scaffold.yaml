id: ci-github-actions
name: GitHub Actions CI
description: Add GitHub Actions CI workflow to an existing project
version: "0.1.0"
language: null
ci_provider: github_actions
network: deny

inputs:
  - name: project_type
    type: enum
    prompt: "Project type?"
    enum_values:
      - rust
      - node
      - python
      - go
      - generic
    required: true
  - name: run_tests
    type: bool
    prompt: "Run tests in CI?"
    default: "true"
  - name: run_lint
    type: bool
    prompt: "Run linting in CI?"
    default: "true"

steps:
  - type: copy
    src: .github
    dest: .github

  - type: render_template
    src: AGENTS.md
    dest: AGENTS.md

  - type: render_template
    src: AGENT.md
    dest: AGENT.md

tests: []
